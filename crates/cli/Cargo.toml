[package]
name = "rrelayer_cli"
version = "0.11.6"
edition = "2024"

[dependencies]
# internal dependencies
rrelayer_core = { path = "../core" }
rrelayer = { path = "../sdk" }

# external dependencies
clap = { version = "4.6.7", features = ["derive"] }
dialoguer = "0.12"
regex = "1.13.1"
colored = "3.1"
tokio = "1.54.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0"
prettytable = "0.10.0"
chrono = "0.4.45"
hex = "0.4.3"
rpassword = "7.5"

alloy = { workspace = true, features = ["full", "signer-mnemonic", "eips", "eip712", "signer-keystore"] }
alloy-rlp = { workspace = true }
alloy-eips = { workspace = true }

# build
tikv-jemalloc-ctl = { version = "0.7.0", optional = true }
tikv-jemallocator = { version = "0.7.0", optional = true }
rand = "0.10.3"
serde_norway = "0.9.42"

[features]
jemalloc = ["dep:tikv-jemallocator", "dep:tikv-jemalloc-ctl"]
