[package]
name = "rrelayer_core"
version = "0.11.6"
resolver = "2"
edition = "2021"
authors = ["joshstevens19@hotmail.co.uk"]
license = "MIT"
description = "Core types and functionality for rrelayer - a powerful blockchain transaction relay service"
homepage = "https://rrelayer.xyz"
repository = "https://github.com/joshstevens19/rrelayer"
documentation = "https://docs.rs/rrelayer_core"
keywords = ["blockchain", "ethereum", "evm", "transaction", "relay"]
categories = ["api-bindings", "web-programming", "cryptography::cryptocurrencies"]
include = [
    "src/**/*",
    "Cargo.toml",
    "../../LICENSE"
]

[dependencies]
tokio-postgres = { version = "0.7", features = ["with-uuid-1", "with-chrono-0_4", "with-serde_json-1"] }
tokio = { version = "1", features = ["full"] }
axum = "0.8"
tower-http = { version = "0.7", features = ["cors"] }
serde = { workspace = true }
serde_json = { workspace = true }
async-trait = "0.1"
reqwest = { version = "0.13", features = ["json"] }
alloy = { workspace = true, features = ["full", "signer-mnemonic", "eips", "eip712", "signer-keystore", "signer-aws", "json-rpc"] }
alloy-rlp = { workspace = true }
alloy-eips = { workspace = true }
uuid = { version = "1.29", features = ["v4", "serde"] }
rand = "0.10"
aws-sdk-secretsmanager = { version = "1.125.0", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-sdk-kms = { version = "1.129.0", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-sdk-sts = { version = "1.124.0", default-features = false, features = ["default-https-client", "rt-tokio", "sigv4a"] }
aws-config = "1.13.0"
base64 = "0.23.1"
chrono = { version = "0.4.45", features = ["serde"] }
bytes = "1.12.1"
regex = "1.13.1"
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "time"] }
once_cell = "1.21.4"
native-tls = "0.2.18"
bb8 = "0.9.1"
bb8-postgres = "0.9.0"
postgres-native-tls = "0.5"
hex = "0.4.3"
anyhow = "1.0.104"
rust_decimal = { version = "1.43.0", features = ["db-tokio-postgres"] }
rustls = { version = "0.23.46", features = ["ring"]}
sha2 = "0.11"
p256 = { version = "0.14", features = ["ecdsa"] }
tower = "0.5.3"
subtle = "2.6.1"
cryptoki = "0.12"
jsonwebtoken = { version = "11.1", features = ["aws_lc_rs"] }
dotenvy = "0.15.7"
serde_norway = "0.9.42"
google-cloud-secretmanager-v1 = "1.14.0"
google-cloud-auth = "1.18.0"
